services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp
      MYSQL_PASSWORD: wppass
    volumes:
      - dbdata:/var/lib/mysql

  wordpress:
    image: wordpress:php8.2-apache
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wppass
    ports:
      - "8792:80"
    volumes:
      - wpdata:/var/www/html
      - ./the-baking-palette:/var/www/html/wp-content/themes/the-baking-palette

  wpcli:
    image: wordpress:cli-php8.2
    depends_on:
      - db
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wppass
    volumes:
      - wpdata:/var/www/html
      - ./the-baking-palette:/var/www/html/wp-content/themes/the-baking-palette
    entrypoint: ["tail", "-f", "/dev/null"]

volumes:
  dbdata:
  wpdata:
